apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: production
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: production
spec:
  selector:
    app: myapp
  ports:
  - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: staging
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: staging
spec:
  selector:
    app: myapp
  ports:
  - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: development
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: development
spec:
  selector:
    app: myapp
  ports:
  - port: 80
