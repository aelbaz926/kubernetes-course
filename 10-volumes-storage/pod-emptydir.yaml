apiVersion: v1
kind: Pod
metadata:
  name: pod-emptydir
spec:
  containers:
    # Container 1: writes data to the shared volume
    - name: writer
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "Written at $(date)" > /data/output.txt
          echo "Container hostname: $(hostname)" >> /data/output.txt
          echo "Some important data line 1" >> /data/output.txt
          echo "Some important data line 2" >> /data/output.txt
          sleep 3600
      volumeMounts:
        - name: shared-data
          mountPath: /data

    # Container 2: reads data from the shared volume
    - name: reader
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared-data
          readOnly: true

  volumes:
    - name: shared-data
      emptyDir: {}
      # emptyDir starts empty, lives as long as the Pod
