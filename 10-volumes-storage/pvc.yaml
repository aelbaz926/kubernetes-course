apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi     # Requesting 500Mi from a 1Gi PV (fits!)
  # No storageClassName specified → binds to a manually created PV
  storageClassName: ""   # Empty string = manual binding (don't use dynamic provisioning)
