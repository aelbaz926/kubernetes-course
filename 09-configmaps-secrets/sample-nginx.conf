server {
    listen 80;
    server_name example.com;

    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static {
        alias /var/www/static;
        expires 30d;
    }

    error_page 500 502 503 504 /50x.html;
}
