apiVersion: v1
kind: Pod
metadata:
  name: pod-with-env
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      env:
        # Individual keys from ConfigMap
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: APP_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_LOG_LEVEL
        - name: APP_MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MAX_CONNECTIONS
        # Individual keys from Secret
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
