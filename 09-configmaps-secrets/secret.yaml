apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  # Values MUST be base64-encoded
  # echo -n "admin" | base64 → YWRtaW4=
  # echo -n "postgres-password123" | base64 → cG9zdGdyZXMtcGFzc3dvcmQxMjM=
  DB_USERNAME: YWRtaW4=
  DB_PASSWORD: cG9zdGdyZXMtcGFzc3dvcmQxMjM=

# Alternatively, use stringData (Kubernetes encodes for you):
# stringData:
#   DB_USERNAME: "admin"
#   DB_PASSWORD: "postgres-password123"
