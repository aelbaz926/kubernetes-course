# This Pod has the SAME labels as the ReplicaSet's selector.
# If the ReplicaSet already has enough replicas, it will TERMINATE this Pod.
# This demonstrates that ReplicaSet "adopts" Pods based on labels.
apiVersion: v1
kind: Pod
metadata:
  name: adopted-pod
  labels:
    app: web-app
spec:
  containers:
    - name: nginx
      image: nginx:1.27
