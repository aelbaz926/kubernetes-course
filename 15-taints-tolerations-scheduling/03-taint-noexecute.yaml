apiVersion: v1
kind: Pod
metadata:
  name: noexecute-toleration-pod
  labels:
    demo: noexecute-toleration
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
  tolerations:
  - key: "maintenance"
    operator: "Equal"
    value: "true"
    effect: "NoExecute"
    tolerationSeconds: 60    # Stay on the node for 60 seconds, then get evicted
